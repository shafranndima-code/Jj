name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Unzip and build
        run: |
          mkdir proj
          unzip -q *.zip -d proj
          F=$(find proj \( -name build.gradle -o -name build.gradle.kts \) | head -1)
          cd "$(dirname "$F")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp $(ls build/libs/*.jar | grep -v -e sources -e dev) "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: prettyhud-jar
          path: out/*.jar
